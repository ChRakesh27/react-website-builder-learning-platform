services:
  - type: web
    name: ai-assistant-server
    env: python
    buildCommand: pip install -r server/requirements.txt && npm ci && npm run build
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: inclusionai/ling-3.0-flash-fin:free
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
